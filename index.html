<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        a{
            text-decoration: none;}

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn.login {
            background-color: #3498db;
            color: white;
        }

        .btn.login:hover {
            background-color: #2980b9;
        }

        .btn.signup {
            background-color: #2ecc71;
            color: white;
        }

        .btn.signup:hover {
            background-color: #27ae60;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Student Management System</h1>
        <a href="login.jsp"><button class="btn login">Login</button></a>
        <a href="signup.jsp"><button class="btn signup">Sign Up</button></a>
        <footer>© 2025 SMS. All rights reserved.</footer>
    </div>
</body>
</html>
